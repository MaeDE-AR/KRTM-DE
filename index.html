<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kort-AR via Google</title>
    <!-- Fiksa faktisk selv, beginner å lære -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000000; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- ar-placement="wall" tvinger modellen til å feste seg på kortet/veggen i stedet for gulvet -->
    <model-viewer 
        src="cube.glb" 
        ios-src="CUBE.usdz" 
        ar
        ar-placement="wall"
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        touch-action="pan-y" 
        alt="En 3D-modell klistret til kortet" 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
