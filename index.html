<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildesporing AR</title>
    
    <!-- Robuste, fullstendige og fungerende lenker til AR-motoren via UNPKG -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Skjuler VR-brille-ikonet på mobilen */
        .a-enter-vr { display: none; }
    </style>
</head>
<body>

    <!-- Starter kameraet og aktiverer lasteskjerm (uiLoading: yes) -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; uiLoading: yes; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Henter 3D-modellen din -->
        <a-asset-item id="avatarModel" src="cube.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex: 0 låser kuben til det første bildet du lastet opp i targets.mind -->
      
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.05 0.05 0.05" src="#avatarModel"></a-gltf-model>
      
      
    </a-scene>

</body>
</html>
