<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildesporing AR</title>
    
    <!-- Lagt til crossorigin="anonymous" for å tvinge nettleseren til å laste dem inn uten blokkering -->
    <script src="https://unpkg.com" crossorigin="anonymous"></script>
    <script src="https://unpkg.com" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        .a-enter-vr { display: none; }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: targets.mind; uiLoading: yes; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="avatarModel" src="cube.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Denne linjen ble rettet opp slik at kuben faktisk vet hvor den skal festes -->
      
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.05 0.05 0.05" src="#avatarModel"></a-gltf-model>
      
      
    </a-scene>

</body>
</html>
