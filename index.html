<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kort-AR via Google</title>
    <!-- Fiksa faktisk selv, beginner å lære -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: ##8f8f8f; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- ar-placement="wall" tvinger modellen til å feste seg på kortet/veggen i stedet for gulvet -->
    <model-viewer 
        src="cube.glb" ios-src="CUBE.usdz" ar ar-placement="wall" camera-controls touch-action="pan-y" alt="En 3D-modell klistret til kortet" shadow-intensity="1">
    
            <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; ">
                👋 Activate AR
            </button>
                          <div class="controls glass">
                    <div>
                      <label for="neutral">Neutral Lighting: </label>
                      <input id="neutral" type="checkbox" checked="true">
                    </div>
                  </div>
                </model-viewer>
                <script>
                  (() => {
                    const modelViewer = document.querySelector('#neutral-demo');
                    const checkbox = document.querySelector('#neutral');

                    checkbox.addEventListener('change', () => {
                      modelViewer.environmentImage = checkbox.checked ? '' : 'legacy';
                    });
                  })();
        
    <div class="controls glass">
                    <div>Variant: <custom-select id="variant"></custom-select></div>
                  </div>
                </model-viewer>
                <script>
                  const modelViewerVariants = document.querySelector("model-viewer#shoe");
                  const select = document.querySelector('#variant');

                  modelViewerVariants.addEventListener('load', () => {
                    const names = modelViewerVariants.availableVariants;
                    for (const name of names) {
                      const option = document.createElement('option');
                      option.value = name;
                      option.textContent = name;
                      select.appendChild(option);
                    }
                    // Adds a default option.
                    const option = document.createElement('option');
                    option.value = 'default';
                    option.textContent = 'Default';
                    select.appendChild(option);
                  });

                  select.addEventListener('input', (event) => {
                    modelViewerVariants.variantName = event.target.value === 'default' ? null : event.target.value;
                  });
                </script>
</body>
</html>
